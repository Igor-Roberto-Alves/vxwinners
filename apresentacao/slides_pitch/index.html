<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Prumo — deck vxwinners</title>
<meta name="viewport" content="width=1920">
<link rel="stylesheet" href="estilo.css">
<script src="conteudo.js"></script>
</head>
<body>

<!-- ============================= S1 · CAPA ============================= -->
<section class="slide s-capa" id="s1" style="--no-top:113px">
  <div class="linha-esquerda"></div>
  <img class="linha-no" src="../estilo_figma/linha_vertical_no.svg" alt="">
  <img class="horizonte" src="../estilo_figma/horizonte_planeta.png" alt="">
  <div class="conteudo">
    <h1 class="titulo" data-texto="capa.titulo"></h1>
    <p class="subtitulo" data-texto="capa.sub"></p>
    <p class="assinatura" data-texto="capa.assinatura"></p>
  </div>
</section>

<!-- ============================ S2 · ÍNDICE ============================ -->
<section class="slide" id="s2">
  <div class="linha-esquerda"></div>
  <img class="linha-no" src="../estilo_figma/linha_vertical_no.svg" alt="">
  <img class="horizonte" src="../estilo_figma/horizonte_planeta.png" alt="">
  <div class="conteudo">
    <h2 class="titulo titulo-menor" data-texto="indice.titulo"></h2>
    <div class="lista-indice" id="lista-indice"></div>
  </div>
</section>

<!-- =========================== S3 · PROBLEMA =========================== -->
<section class="slide" id="s3">
  <div class="linha-esquerda"></div>
  <img class="linha-no" src="../estilo_figma/linha_vertical_no.svg" alt="">
  <img class="horizonte" src="../estilo_figma/horizonte_planeta.png" alt="">
  <div class="conteudo">
    <p class="etiqueta" data-texto="problema.etiqueta"></p>
    <h2 class="titulo titulo-menor" data-texto="problema.titulo"></h2>
    <div class="grade-problema" id="grade-problema"></div>
  </div>
  <div class="faixa-rodape" data-texto="problema.rodape"></div>
</section>

<!-- ======================== S4 · COMO FUNCIONA ========================= -->
<section class="slide" id="s4">
  <div class="linha-esquerda"></div>
  <img class="linha-no" src="../estilo_figma/linha_vertical_no.svg" alt="">
  <img class="horizonte" src="../estilo_figma/horizonte_planeta.png" alt="">
  <div class="conteudo">
    <p class="etiqueta" data-texto="comoFunciona.etiqueta"></p>
    <h2 class="titulo titulo-menor" data-texto="comoFunciona.titulo"></h2>
    <div class="fluxo" id="fluxo"></div>
    <p class="sub-fluxo" id="sub-fluxo"></p>
  </div>
</section>

<!-- =========================== S5 · EVIDÊNCIA ========================== -->
<section class="slide" id="s5">
  <div class="linha-esquerda"></div>
  <img class="linha-no" src="../estilo_figma/linha_vertical_no.svg" alt="">
  <img class="horizonte" src="../estilo_figma/horizonte_planeta.png" alt="">
  <div class="conteudo">
    <p class="etiqueta" data-texto="evidencia.etiqueta"></p>
    <h2 class="titulo titulo-menor" data-texto="evidencia.titulo"></h2>
    <div class="grade-medidores" id="grade-medidores"></div>
  </div>
  <div class="faixa-rodape" data-texto="evidencia.faixa"></div>
</section>

<!-- =========================== S6 · DINHEIRO =========================== -->
<section class="slide" id="s6">
  <div class="linha-esquerda"></div>
  <img class="linha-no" src="../estilo_figma/linha_vertical_no.svg" alt="">
  <img class="horizonte" src="../estilo_figma/horizonte_planeta.png" alt="">
  <div class="conteudo">
    <p class="etiqueta" data-texto="dinheiro.etiqueta"></p>
    <h2 class="titulo titulo-menor" data-texto="dinheiro.titulo"></h2>
    <div class="painel-dinheiro">
      <div class="grafico-barras" id="grafico-barras" role="img"
           aria-label="Gráfico de barras: capital consolidável em R$ milhões"></div>
      <aside class="destaque-lateral" id="destaque-lateral"></aside>
    </div>
  </div>
  <div class="faixa-rodape" data-texto="dinheiro.rodape"></div>
</section>

<!-- ============================= S7 · DEMO ============================= -->
<section class="slide s-demo" id="s7">
  <div class="linha-esquerda"></div>
  <img class="linha-no" src="../estilo_figma/linha_vertical_no.svg" alt="">
  <img class="horizonte" src="../estilo_figma/horizonte_planeta.png" alt="">
  <div class="conteudo">
    <p class="etiqueta" data-texto="demo.etiqueta"></p>
    <h2 class="titulo titulo-menor" data-texto="demo.titulo"></h2>
    <p class="subtitulo" data-texto="demo.sub"></p>
  </div>
  <!-- vídeo da demo embutido na tela do MacBook; no PNG/PDF fica o poster -->
  <div class="mockup-demo">
    <video class="video-demo" src="../demo_mvp_v2.mp4" poster="img/poster_demo.png"
           controls muted playsinline preload="none"></video>
    <img class="moldura-mockup" src="img/moldura_macbook.png" alt="Plataforma rodando num MacBook">
  </div>
</section>

<!-- ============================ S8 · MERCADO =========================== -->
<section class="slide" id="s8">
  <div class="linha-esquerda"></div>
  <img class="linha-no" src="../estilo_figma/linha_vertical_no.svg" alt="">
  <img class="horizonte" src="../estilo_figma/horizonte_planeta.png" alt="">
  <div class="conteudo">
    <p class="etiqueta" data-texto="mercado.etiqueta"></p>
    <h2 class="titulo titulo-menor" data-texto="mercado.titulo"></h2>
    <div class="grade-mercado" id="grade-mercado"></div>
  </div>
  <div class="faixa-rodape" data-texto="mercado.rodape"></div>
</section>

<!-- ============================= S9 · TIME ============================= -->
<section class="slide" id="s9">
  <div class="linha-esquerda"></div>
  <img class="linha-no" src="../estilo_figma/linha_vertical_no.svg" alt="">
  <img class="horizonte" src="../estilo_figma/horizonte_planeta.png" alt="">
  <div class="conteudo">
    <p class="etiqueta" data-texto="time.etiqueta"></p>
    <h2 class="titulo titulo-menor" data-texto="time.titulo"></h2>
    <div class="grade-time" id="grade-time"></div>
  </div>
</section>

<!-- =========================== S10 · OBRIGADO ========================== -->
<section class="slide s-obrigado" id="s10" style="--no-top:113px">
  <div class="linha-esquerda"></div>
  <img class="linha-no" src="../estilo_figma/linha_vertical_no.svg" alt="">
  <img class="horizonte" src="../estilo_figma/horizonte_planeta.png" alt="">
  <div class="conteudo">
    <h2 class="titulo" data-texto="obrigado.titulo"></h2>
    <p class="assinatura" data-texto="obrigado.assinatura"></p>
    <p class="url" data-texto="obrigado.url"></p>
  </div>
</section>

<script>
(function () {
  var C = window.CONTEUDO;

  /* ícones de traço (sem emoji), 24x24, stroke currentColor */
  var ICONES = {
    capital:
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
      '<ellipse cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 6v6c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3V6"/>' +
      '<path d="M4.5 12v6c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3v-6"/></svg>',
    compra:
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
      '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="5" width="7" height="7" rx="1.5"/>' +
      '<rect x="5" y="14" width="7" height="7" rx="1.5"/><path d="M17.5 15.5v5M15 18h5"/></svg>',
    operacao:
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
      '<circle cx="12" cy="13" r="8"/><path d="M12 9.5V13l2.6 2.6"/><path d="M9.5 2.5h5"/></svg>',
    fiscal:
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M6 2.8h8.5L20 8.3V21.2H6z"/><path d="M14.5 2.8v5.5H20"/>' +
      '<path d="M9.5 12.2l5 5.6M10 17.8a.8.8 0 1 0 0-.01M14.5 12.4a.8.8 0 1 0 0-.01"/></svg>',
    pessoa:
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
      '<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.2-3.6 4.1-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></svg>',
    seta:
      '<svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M4 12h15M13 6l6 6-6 6"/></svg>'
  };

  function texto(caminho) {
    return caminho.split(".").reduce(function (o, k) { return o[k]; }, C);
  }
  document.querySelectorAll("[data-texto]").forEach(function (el) {
    el.textContent = texto(el.getAttribute("data-texto"));
  });

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function escapa(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  /* S2 índice */
  var li = document.getElementById("lista-indice");
  C.indice.itens.forEach(function (item, i) {
    li.appendChild(el("div", "item-indice",
      '<span class="num">' + String(i + 1).padStart(2, "0") + "</span>" +
      '<span class="rotulo">' + escapa(item) + "</span>"));
  });

  /* S3 problema */
  var gp = document.getElementById("grade-problema");
  C.problema.cartoes.forEach(function (c) {
    gp.appendChild(el("div", "cartao",
      '<div class="chip-icone">' + ICONES[c.icone] + "</div>" +
      "<div><h3>" + escapa(c.titulo) + "</h3><p>" + escapa(c.texto) + "</p></div>"));
  });

  /* S4 fluxo */
  var fl = document.getElementById("fluxo");
  C.comoFunciona.passos.forEach(function (p, i) {
    var passo = el("div", "passo");
    passo.appendChild(el("div", "cartao",
      '<div class="num-passo">' + escapa(p.n) + "</div>" +
      "<h3>" + escapa(p.titulo) + "</h3><p>" + escapa(p.texto) + "</p>"));
    fl.appendChild(passo);
    if (i < C.comoFunciona.passos.length - 1) fl.appendChild(el("div", "seta", ICONES.seta));
  });
  document.getElementById("sub-fluxo").innerHTML =
    "<strong>Determinístico e auditável:</strong> " +
    escapa(C.comoFunciona.sub.replace(/^Determinístico e auditável:\s*/, ""));

  /* S5 medidores */
  var gm = document.getElementById("grade-medidores");
  C.evidencia.medidores.forEach(function (m) {
    gm.appendChild(el("div", "cartao medidor",
      '<div class="campo">' + escapa(m.campo) + "</div>" +
      '<div class="valor">' + escapa(m.valor) + "</div>" +
      '<div class="nota">' + escapa(m.nota) + "</div>" +
      '<div class="trilho"><div class="preenchido" style="width:' + m.pct + '%"></div></div>'));
  });

  /* S6 barras — escala linear a partir de zero, rótulo direto na ponta */
  var gb = document.getElementById("grafico-barras");
  var max = Math.max.apply(null, C.dinheiro.barras.map(function (b) { return b.valor; }));
  C.dinheiro.barras.forEach(function (b) {
    var pct = (b.valor / max) * 100;
    var linha = el("div", "linha-barra");
    linha.innerHTML =
      '<div class="rotulo">' + escapa(b.rotulo) +
      (b.nota ? ' <span class="nota-barra">' + escapa(b.nota) + "</span>" : "") + "</div>" +
      '<div class="trilho-barra">' +
      '<div class="barra" style="width:' + pct.toFixed(1) + '%"></div>' +
      '<span class="valor-barra">' + escapa(b.texto) + "</span></div>";
    gb.appendChild(linha);
  });
  document.getElementById("destaque-lateral").innerHTML =
    '<div class="titulo-destaque">' + escapa(C.dinheiro.destaque.titulo) + "</div>" +
    '<div class="valor-destaque">' + escapa(C.dinheiro.destaque.valor) + "</div>" +
    '<div class="nota-destaque">' + escapa(C.dinheiro.destaque.nota) + "</div>";

  /* S8 mercado */
  var gmer = document.getElementById("grade-mercado");
  C.mercado.colunas.forEach(function (c) {
    gmer.appendChild(el("div", "cartao coluna-mercado",
      '<span class="sigla">' + escapa(c.sigla) + "</span>" +
      "<h3>" + escapa(c.titulo) + "</h3><p>" + escapa(c.texto) + "</p>"));
  });

  /* S9 time */
  var gt = document.getElementById("grade-time");
  C.time.membros.forEach(function (m) {
    gt.appendChild(el("div", "cartao cartao-pessoa",
      '<div class="avatar">' + ICONES.pessoa + "</div>" +
      '<div class="nome">' + escapa(m.nome) + "</div>" +
      '<div class="funcao">' + escapa(m.funcao) + "</div>"));
  });

  /* navegação: setas / PageUp / PageDown / espaço */
  var slides = Array.prototype.slice.call(document.querySelectorAll(".slide"));
  function slideAtual() {
    var y = window.scrollY || document.documentElement.scrollTop || document.body.scrollTop;
    return Math.round(y / 1080);
  }
  function vaiPara(i) {
    i = Math.max(0, Math.min(slides.length - 1, i));
    slides[i].scrollIntoView({ behavior: "smooth", block: "start" });
  }
  document.addEventListener("keydown", function (ev) {
    if (["ArrowRight", "ArrowDown", "PageDown", " "].indexOf(ev.key) >= 0) {
      ev.preventDefault(); vaiPara(slideAtual() + 1);
    } else if (["ArrowLeft", "ArrowUp", "PageUp"].indexOf(ev.key) >= 0) {
      ev.preventDefault(); vaiPara(slideAtual() - 1);
    } else if (ev.key === "Home") { ev.preventDefault(); vaiPara(0); }
    else if (ev.key === "End") { ev.preventDefault(); vaiPara(slides.length - 1); }
  });
})();
</script>
</body>
</html>
